      const isRegistered = user && !user.isAnonymous;
      const isModerator = isRegistered && (currentUserTag === 'MOFU' || badges.includes('Admin'));

      // Computed Submissions
      const mySubmissions = useMemo(() => {
         return allSubmissions.filter(sub => sub.uid === user?.uid);
      }, [allSubmissions, user]);

      // --- INITIALIZE FIREBASE AUTH & USER PROFILE ---
      useEffect(() => {
        if (!auth) { setAuthResolved(true); return; }
        
        const initAuth = async () => { 
          try { 
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) { 
              try { await signInWithCustomToken(auth, __initial_auth_token); return; } catch(e) {} 
            } 
            await signInAnonymously(auth); 
          } catch(e) {} 
        };
        initAuth(); 
        
        return onAuthStateChanged(auth, u => { 
          setUser(u); 
          setAuthResolved(true); 
        });
      }, []);

      useEffect(() => {
        if (!user || user.isAnonymous || !db) return;
        const userRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'users', user.uid);
        
        return onSnapshot(userRef, s => { 
          if(s.exists()){ 
            const d = s.data(); 
            if(d.badges) setBadges(d.badges);
            if(d.userFrame) setUserFrame(d.userFrame);
            if(d.userTag) setCurrentUserTag(d.userTag);
            if(d.photoURL !== undefined) setCurrentUserPhoto(d.photoURL); 
          } 
        });
      }, [user]);

      // --- SUBSCRIPTIONS ---
      useEffect(() => {
        if(!db) return;
        // Fetch Submissions Database
        const unsub = onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'gameSubmissions'), snap => {
           const arr = []; 
           snap.forEach(d => arr.push({id: d.id, ...d.data()})); 
           setAllSubmissions(arr.sort((a,b) => b.timestamp - a.timestamp));
        });
        return () => unsub();
      }, [db]);

      // Remove Native Loader
      useEffect(() => { 
        if (authResolved) { 
          const loader = document.getElementById('nexis-global-loader'); 
          if (loader) { 
            loader.style.opacity = '0'; 
            loader.style.visibility = 'hidden'; 
            setTimeout(() => loader.remove(), 400); 
          } 
        } 
      }, [authResolved]);

      // Turnstile logic
      useEffect(() => {
        if (showAuthModal && (authMode === 'login' || authMode === 'signup')) {
            const attemptRender = () => {
                const el = document.getElementById('turnstile-container');
                if (window.turnstile && el) {
                    try {
                        if (el.innerHTML === "") { 
                          window.turnstile.render('#turnstile-container', { 
                            sitekey: '0x4AAAAAADJvsIsXA6ZWtber', 
                            theme: 'dark' 
                          }); 
                        }
                        setCaptchaBypass(false);
                    } catch (e) {
                        setCaptchaBypass(true);
                    }
                } else {
                    setTimeout(attemptRender, 100);
                }
            };
            attemptRender();
        } else {
            setCaptchaBypass(false);
        }
      }, [showAuthModal, authMode]);

      useEffect(() => {
        if (authMode === 'signup') {
          setBotCheck({ num1: Math.floor(Math.random() * 10) + 1, num2: Math.floor(Math.random() * 10) + 1, answer: '' });
        }
      }, [authMode]);

      // --- HANDLERS ---
      const showToastMessage = (message, type = 'success') => { 
        setToast({ message, type }); 
        setTimeout(() => setToast(null), 3500); 
      };

      const toggleTag = (tag) => {
        if (selectedTags.includes(tag)) setSelectedTags(selectedTags.filter(t => t !== tag));
        else {
          if (selectedTags.length >= 4) return;
          setSelectedTags([...selectedTags, tag]);
        }
      };

      const handleIconChange = (e) => {
        const file = e.target.files?.[0] || e.dataTransfer?.files?.[0];
        if (file && file.type.startsWith('image/')) {
          if (file.size > 5000000) { alert("Icon is too large (max 5MB)."); return; }
          setIconFile(file);
          setIconPreview(URL.createObjectURL(file));
        }
      };

      const handleGameFileChange = (e) => {
        const file = e.target.files?.[0] || e.dataTransfer?.files?.[0];
        if (file && (file.name.endsWith('.zip') || file.name.endsWith('.html'))) {
          setGameFile(file);
        } else if (file) {
          alert("Please upload a .zip or .html file.");
        }
      };

      // --- AUTHENTICATION ---
      const handleSignup = async (e) => {
        e.preventDefault(); 
        if (authCooldown) return;
        setAuthError(''); setAuthLoading(true); setAuthCooldown(true);

        try {
          if (!sanitizeUsername(username)) throw new Error("Validation Error: Username must be 3-16 characters and contain only letters, numbers, and underscores. No inappropriate names.");
          
          if (!captchaBypass) {
              const turnstileResponse = window.turnstile ? window.turnstile.getResponse() : '';
              if (!turnstileResponse) throw new Error("Validation Error: Please complete the security verification!");
          } else {
              // Fallback Math Check if Turnstile failed to load in the Canvas iframe
              if (parseInt(botCheck.answer) !== (botCheck.num1 + botCheck.num2)) {
                 throw new Error("Validation Error: Incorrect math answer!");
              }
          }
          
          let tag = Math.random().toString(36).substring(2, 6).toUpperCase();
          const tagRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'uniqueTags', tag);
          const snap = await getDoc(tagRef); 
          if (snap.exists()) throw new Error("Tag collision, try again.");
          
          const userCredential = await createUserWithEmailAndPassword(auth, email, password); 
          await updateProfile(userCredential.user, { displayName: username.trim() });
          
          try { 
            await setDoc(tagRef, { uid: userCredential.user.uid, username: username.trim(), userTag: tag }); 
            await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'users', userCredential.user.uid), { 
              uid: userCredential.user.uid, username: username.trim(), userTag: tag, photoURL: '', bannerURL: '', bio: '', currentStreak: 1, currentXP: 0,
              favorites: [], badges: [], status: 'active', lastPlayedDate: new Date().toISOString()
            }); 
          } catch(e) {}
          
          await sendEmailVerification(userCredential.user);
          await signOut(auth);
          
          if (window.turnstile && !captchaBypass) window.turnstile.reset();
          setAuthMode('login');
          showToastMessage(`Account created! Please verify your email before logging in.`, 'success');
        } catch (err) { 
          if (err.message.includes("Validation Error") || err.message.includes("collision")) setAuthError(err.message);
          else if (err.code === 'auth/email-already-in-use') setAuthError("An account with that email already exists.");
          else setAuthError("Sign up failed. Please check your information and try again.");
          if (window.turnstile && !captchaBypass) window.turnstile.reset();
          setBotCheck({ num1: Math.floor(Math.random() * 10) + 1, num2: Math.floor(Math.random() * 10) + 1, answer: '' });
        } finally { setAuthLoading(false); setTimeout(() => setAuthCooldown(false), 2000); }
      };

      const handleLogin = async (e) => { 
        e.preventDefault(); 
        if (authCooldown) return;
        setAuthError(''); setAuthLoading(true); setAuthCooldown(true);

        try { 
          if (!captchaBypass) {
              const turnstileResponse = window.turnstile ? window.turnstile.getResponse() : '';
              if (!turnstileResponse) throw new Error("Validation Error: Please complete the security verification!");
          }
          const userCredential = await signInWithEmailAndPassword(auth, email, password); 
          if (!userCredential.user.emailVerified) {
            await sendEmailVerification(userCredential.user); await signOut(auth);
            throw new Error("Security Error: Email not verified! We just sent a NEW verification link to your inbox/spam folder. Please click it to continue.");
          }
          if (window.turnstile && !captchaBypass) window.turnstile.reset();
          setShowAuthModal(false); showToastMessage("Logged in!"); setAuthLoading(false); setAuthCooldown(false);
        } catch (err) { 
          if (window.turnstile && !captchaBypass) window.turnstile.reset();
          if (err.message.includes("Security Error") || err.message.includes("Validation Error")) {
              setAuthError(err.message); setAuthLoading(false); setTimeout(() => setAuthCooldown(false), 2000);
          } else {
              setAuthError(`Login failed. Invalid email or password.`);
              setAuthLoading(false); setTimeout(() => setAuthCooldown(false), 1000);
          }
        } 
      };

      const handlePasswordReset = async (e) => { 
        e.preventDefault(); setAuthError(''); setResetMessage(''); setAuthLoading(true); 
        try { if (!email) throw new Error("Enter email."); await sendPasswordResetEmail(auth, email); setResetMessage('Reset email sent!'); } 
        catch (err) { setAuthError(err.message.replace('Firebase: ', '')); } finally { setAuthLoading(false); } 
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!isRegistered) {
           setShowAuthModal(true);
           return;
        }
        if (!title || !author || !iconFile || !gameFile || selectedTags.length === 0) return;

        setUploadStatus('uploading');
        setUploadProgress(0);

        const interval = setInterval(() => {
          setUploadProgress(prev => {
            const next = prev + (Math.random() * 15);
            if (next >= 100) {
              clearInterval(interval);
              
              if (db && user) {
                addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'gameSubmissions'), {
                   title: filterMessage(title.trim()),
                   developer: filterMessage(author.trim()),
                   description: filterMessage(description.trim()),
                   tags: selectedTags,
                   uid: user.uid,
                   status: 'pending',
                   adminComment: '',
                   timestamp: Date.now()
                }).catch(e => console.error(e));
              }

              setTimeout(() => setUploadStatus('success'), 500);
              return 100;
            }
            return next;
          });
        }, 300);
      };

      const handleDeleteSubmission = async (id) => {
         if (!window.confirm("Are you sure you want to permanently delete this submission?")) return;
         try {
             await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'gameSubmissions', id));
         } catch(e) { alert("Failed to delete."); }
      };

      const handleAdminUpdate = async (id, newStatus, newComment) => {
         try {
             await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'gameSubmissions', id), {
                 status: newStatus,
                 adminComment: filterMessage(newComment.trim())
             });
             alert("Submission successfully updated!");
         } catch(e) { alert("Failed to update."); }
      };

      const resetForm = () => {
        setTitle(''); setAuthor(''); setDescription(''); setSelectedTags([]);
        setIconFile(null); setIconPreview(null); setGameFile(null);
        setUploadStatus('idle'); setUploadProgress(0);
        setActiveView('my-submissions');
      };

      const activeFrame = AVATAR_FRAMES.find(f => f.id === userFrame)?.style || '';

      return (
        <div className="h-screen flex flex-col relative z-10">
          
          <div className="pointer-events-none fixed inset-0 overflow-hidden z-[-1]">
            <div className="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-violet-600/10 blur-[120px]"></div>
            <div className="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-fuchsia-600/10 blur-[120px]"></div>
            <div className="absolute inset-0 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-obsidian-800/80 via-[#030008] to-[#000000]"></div>
          </div>

          <header className="px-6 md:px-10 py-5 flex justify-between items-center sticky top-0 z-[60] glass-panel border-b border-violet-500/20 shadow-lg">
            <div className="flex items-center gap-4">
              <div className="w-10 h-10 rounded-[12px] bg-gradient-to-br from-violet-600 to-fuchsia-600 flex items-center justify-center overflow-hidden border border-violet-400/30 shadow-[0_0_15px_rgba(139,92,246,0.4)] relative">
                <img src="assets/Favicon.png" alt="NG" className="w-full h-full object-cover" onError={(e) => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'block'; }} />
                <CodeIcon size={20} className="text-white hidden" />
              </div>
              <h1 className="text-2xl font-black tracking-widest text-violet-100 font-heading hidden sm:block">NEXIS <span className="text-fuchsia-400">DEVELOPER</span></h1>
            </div>
            
            <div className="flex items-center gap-6">
              {isRegistered ? (
                 <div className="flex items-center gap-3">
                    <div className="hidden sm:flex flex-col items-end">
                       <span className="text-sm font-bold text-violet-200 block font-heading tracking-wide drop-shadow-md">{user.displayName}</span>
                       <span className="text-[10px] text-violet-400 font-ui font-bold">#{currentUserTag}</span>
                    </div>
                    <div className={`w-10 h-10 rounded-xl bg-obsidian-800 flex items-center justify-center overflow-hidden shadow-lg border ${activeFrame}`}>
                       {currentUserPhoto ? <img src={currentUserPhoto} className="w-full h-full object-cover"/> : <span className="font-bold text-violet-200">{user.displayName?.charAt(0).toUpperCase()}</span>}
                    </div>
                 </div>
              ) : (
                 <button onClick={() => setShowAuthModal(true)} className="px-6 py-2 bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white font-bold font-ui text-xs uppercase tracking-widest rounded-full shadow-lg hover:scale-105 transition-all">Sign In</button>
              )}
              <div className="w-px h-8 bg-violet-500/20 mx-2"></div>
              <a href="https://nexisgd.com" className="flex items-center gap-2 text-violet-400 hover:text-violet-200 transition-colors font-bold font-ui text-xs uppercase tracking-widest bg-obsidian-950 px-4 py-2.5 rounded-xl border border-violet-500/20 shadow-inner whitespace-nowrap active:scale-95">
                <ArrowLeftIcon size={14} /> Back to Hub
              </a>
            </div>
          </header>

          <main className="flex-1 overflow-y-auto px-4 py-8 md:py-12 flex flex-col items-center">
            
            {/* Developer Navigation Tabs */}
            <div className="w-full max-w-5xl flex justify-center mb-10">
               <div className="flex bg-obsidian-950/80 p-1.5 rounded-2xl border border-violet-500/20 shadow-inner overflow-x-auto scrollbar-hide max-w-full">
                  <button onClick={() => setActiveView('submit')} className={`flex items-center gap-2 px-6 py-2.5 rounded-xl font-bold font-ui text-sm uppercase tracking-widest transition-all whitespace-nowrap ${activeView === 'submit' ? 'bg-violet-600 text-white shadow-md' : 'text-violet-400 hover:text-violet-200 hover:bg-white/5'}`}>
                     <UploadCloudIcon size={18} /> Submit Game
                  </button>
                  <button onClick={() => setActiveView('my-submissions')} className={`flex items-center gap-2 px-6 py-2.5 rounded-xl font-bold font-ui text-sm uppercase tracking-widest transition-all whitespace-nowrap ${activeView === 'my-submissions' ? 'bg-violet-600 text-white shadow-md' : 'text-violet-400 hover:text-violet-200 hover:bg-white/5'}`}>
                     <Gamepad2Icon size={18} /> My Submissions
                  </button>
                  {isModerator && (
                    <button onClick={() => setActiveView('admin')} className={`flex items-center gap-2 px-6 py-2.5 rounded-xl font-bold font-ui text-sm uppercase tracking-widest transition-all whitespace-nowrap ${activeView === 'admin' ? 'bg-rose-600 text-white shadow-md' : 'text-rose-400/70 hover:text-rose-300 hover:bg-white/5'}`}>
                       <ShieldIcon size={18} /> Review Queue
                    </button>
                  )}
               </div>
            </div>

            {/* --- VIEW: SUBMIT GAME --- */}
            {activeView === 'submit' && (
               <div className="w-full max-w-4xl animate-slide-up">
                 <div className="mb-10 text-center">
                   <h2 className="text-4xl md:text-5xl font-black font-heading text-white mb-4 drop-shadow-[0_0_15px_rgba(139,92,246,0.3)]">Publish Your Game</h2>
                   <p className="text-lg text-violet-300/70 font-ui max-w-2xl mx-auto">Submit your HTML5 or WebGL creation to the Nexis Games Hub. Our moderation team reviews all submissions within 24 hours.</p>
                 </div>

                 {!isRegistered && uploadStatus === 'idle' ? (
                   <div className="glass-panel rounded-[2.5rem] p-12 text-center shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
                      <div className="w-20 h-20 bg-rose-500/10 rounded-full flex items-center justify-center mx-auto mb-6 border border-rose-500/30">
                        <UserIcon size={40} className="text-rose-500" />
                      </div>
                      <h3 className="text-3xl font-black font-heading text-white mb-4">Authentication Required</h3>
                      <p className="text-violet-300 font-ui text-lg mb-8 max-w-md mx-auto">You must be logged into your Nexis Games account to submit a game.</p>
                      <button onClick={() => setShowAuthModal(true)} className="inline-block px-10 py-4 bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white font-bold font-heading tracking-widest text-xl uppercase rounded-2xl transition-all shadow-[0_0_30px_rgba(139,92,246,0.4)] hover:scale-105">Sign In Now</button>
                   </div>
                 ) : uploadStatus === 'success' ? (
                   <div className="glass-panel rounded-[2.5rem] p-12 text-center shadow-[0_20px_50px_rgba(0,0,0,0.5)] animate-modal-pop">
                     <div className="w-24 h-24 bg-emerald-500/20 rounded-full flex items-center justify-center mx-auto mb-6 border border-emerald-500/40 shadow-[0_0_30px_rgba(16,185,129,0.3)]">
                       <CheckCircleIcon size={48} className="text-emerald-400" />
                     </div>
                     <h3 className="text-3xl font-black font-heading text-white mb-4">Submission Successful!</h3>
                     <p className="text-violet-300 font-ui text-lg mb-8 max-w-md mx-auto">Your game <strong>{title}</strong> has been securely uploaded and added to the review queue.</p>
                     <button onClick={resetForm} className="px-10 py-4 bg-obsidian-900 hover:bg-obsidian-800 text-violet-200 font-bold font-heading tracking-widest uppercase rounded-2xl transition-all border border-violet-500/30 hover:border-violet-500/60 shadow-lg">View Submissions</button>
                   </div>
                 ) : (
                   <form onSubmit={handleSubmit} className="glass-panel rounded-[2.5rem] p-6 md:p-10 shadow-[0_20px_50px_rgba(0,0,0,0.5)] relative overflow-hidden">
                     
                     {uploadStatus === 'uploading' && (
                       <div className="absolute inset-0 bg-obsidian-950/90 backdrop-blur-xl z-50 flex flex-col items-center justify-center p-10 animate-in fade-in">
                          <UploadCloudIcon size={64} className="text-violet-500 animate-bounce mb-6 drop-shadow-[0_0_15px_rgba(139,92,246,0.5)]" />
                          <h3 className="text-2xl font-black font-heading text-white mb-2">Encrypting & Uploading...</h3>
                          <p className="text-violet-400 font-ui mb-8">Please do not close this window.</p>
                          <div className="w-full max-w-md bg-obsidian-900 rounded-full h-4 border border-violet-500/20 overflow-hidden shadow-inner">
                             <div className="h-full bg-gradient-to-r from-violet-600 to-fuchsia-500 transition-all duration-300 ease-out" style={{ width: `${uploadProgress}%` }}></div>
                          </div>
                          <span className="mt-4 font-bold font-ui text-white">{Math.round(uploadProgress)}%</span>
                       </div>
                     )}

                     <div className="grid grid-cols-1 lg:grid-cols-5 gap-10">
                       <div className="lg:col-span-3 space-y-8">
                         <div>
                           <h3 className="text-xl font-bold font-heading text-violet-100 mb-6 flex items-center gap-3 border-b border-violet-500/10 pb-3">
                             <span className="bg-violet-600/20 p-2 rounded-lg text-violet-400"><CodeIcon size={20}/></span> Basic Information
                           </h3>
                           
                           <div className="space-y-5">
                             <div>
                               <label className="block text-xs font-bold tracking-widest uppercase text-violet-400 mb-2 ml-1">Game Title <span className="text-rose-500">*</span></label>
                               <input type="text" required value={title} onChange={e => setTitle(e.target.value)} placeholder="e.g., Cyberpunk Runner 2077" className="w-full bg-obsidian-950/80 border border-violet-500/20 rounded-2xl px-5 py-4 font-ui text-lg text-white focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition-all shadow-inner" />
                             </div>
                             
                             <div>
                               <label className="block text-xs font-bold tracking-widest uppercase text-violet-400 mb-2 ml-1">Developer / Studio Name <span className="text-rose-500">*</span></label>
                               <input type="text" required value={author} onChange={e => setAuthor(e.target.value)} placeholder="Your Name or Studio" className="w-full bg-obsidian-950/80 border border-violet-500/20 rounded-2xl px-5 py-4 font-ui text-lg text-white focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition-all shadow-inner" />
                             </div>

                             <div>
                               <label className="block text-xs font-bold tracking-widest uppercase text-violet-400 mb-2 ml-1">Short Description</label>
                               <textarea value={description} onChange={e => setDescription(e.target.value)} rows="3" placeholder="Briefly describe your game mechanics and story..." className="w-full bg-obsidian-950/80 border border-violet-500/20 rounded-2xl px-5 py-4 font-ui text-lg text-white focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition-all shadow-inner resize-none"></textarea>
                             </div>
                           </div>
                         </div>

                         <div>
                           <div className="flex justify-between items-end mb-4">
                              <label className="block text-xs font-bold tracking-widest uppercase text-violet-400 ml-1">Game Tags <span className="text-rose-500">*</span></label>
                              <span className="text-xs font-ui text-violet-500">{selectedTags.length}/4 Selected</span>
                           </div>
                           <div className="flex flex-wrap gap-2 p-4 bg-obsidian-950/50 rounded-2xl border border-violet-500/10 shadow-inner">
                             {GAME_CATEGORIES.map(tag => {
                               const isSelected = selectedTags.includes(tag);
                               return (
                                 <button 
                                   type="button" 
                                   key={tag} 
                                   onClick={() => toggleTag(tag)}
                                   className={`px-4 py-2 rounded-xl text-sm font-bold font-ui transition-all border ${isSelected ? 'bg-violet-600 text-white border-violet-500 shadow-[0_0_10px_rgba(139,92,246,0.5)]' : 'bg-obsidian-900 text-slate-400 border-white/5 hover:border-violet-500/30 hover:text-violet-200'}`}
                                 >
                                   {tag}
                                 </button>
                               );
                             })}
                           </div>
                           {selectedTags.length === 0 && <p className="text-rose-500 text-xs mt-2 ml-1">Please select at least 1 tag.</p>}
                         </div>
                       </div>

                       <div className="lg:col-span-2 space-y-8">
                         <h3 className="text-xl font-bold font-heading text-violet-100 mb-6 flex items-center gap-3 border-b border-violet-500/10 pb-3">
                            <span className="bg-fuchsia-600/20 p-2 rounded-lg text-fuchsia-400"><UploadCloudIcon size={20}/></span> Media & Files
                         </h3>

                         <div>
                           <label className="block text-xs font-bold tracking-widest uppercase text-violet-400 mb-2 ml-1">Game Icon (1:1 Ratio) <span className="text-rose-500">*</span></label>
                           <div 
                             onClick={() => iconInputRef.current?.click()}
                             onDragOver={(e) => { e.preventDefault(); setIsDraggingIcon(true); }}
                             onDragLeave={() => setIsDraggingIcon(false)}
                             onDrop={(e) => { e.preventDefault(); setIsDraggingIcon(false); handleIconChange(e); }}
                             className={`w-full aspect-square max-w-[240px] mx-auto rounded-[2rem] flex flex-col items-center justify-center cursor-pointer transition-all border-2 border-dashed overflow-hidden relative group ${isDraggingIcon ? 'border-violet-400 bg-violet-600/20' : iconPreview ? 'border-transparent bg-obsidian-950 shadow-[0_0_30px_rgba(0,0,0,0.8)]' : 'border-violet-500/30 bg-obsidian-950/50 hover:border-violet-400 hover:bg-obsidian-900'}`}
                           >
                             {iconPreview ? (
                               <>
                                 <img src={iconPreview} alt="Icon Preview" className="w-full h-full object-cover" />
                                 <div className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-sm">
                                   <span className="text-white font-bold font-ui text-sm bg-obsidian-900 px-4 py-2 rounded-xl border border-white/20">Change Icon</span>
                                 </div>
                               </>
                             ) : (
                               <div className="text-center p-6 pointer-events-none">
                                 <ImageIcon size={48} className="mx-auto text-violet-500/50 mb-3 group-hover:text-violet-400 transition-colors group-hover:scale-110 duration-300" />
                                 <p className="text-violet-300 font-bold font-ui text-sm">Click or Drag Icon</p>
                                 <p className="text-slate-500 text-xs mt-1">PNG, JPG up to 5MB</p>
                               </div>
                             )}
                             <input type="file" ref={iconInputRef} onChange={handleIconChange} accept="image/png, image/jpeg, image/webp" className="hidden" />
                           </div>
                         </div>

                         <div>
                           <label className="block text-xs font-bold tracking-widest uppercase text-violet-400 mb-2 ml-1">Game Package (.ZIP / .HTML) <span className="text-rose-500">*</span></label>
                           <div 
                             onClick={() => gameInputRef.current?.click()}
                             onDragOver={(e) => { e.preventDefault(); setIsDraggingFile(true); }}
                             onDragLeave={() => setIsDraggingFile(false)}
                             onDrop={(e) => { e.preventDefault(); setIsDraggingFile(false); handleGameFileChange(e); }}
                             className={`w-full rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer transition-all border-2 border-dashed ${isDraggingFile ? 'border-fuchsia-400 bg-fuchsia-600/20' : gameFile ? 'border-emerald-500/50 bg-emerald-500/10' : 'border-violet-500/30 bg-obsidian-950/50 hover:border-violet-400 hover:bg-obsidian-900'}`}
                           >
                             {gameFile ? (
                               <div className="flex flex-col items-center text-center">
                                 <div className="w-12 h-12 bg-emerald-500/20 rounded-full flex items-center justify-center mb-3 border border-emerald-500/30">
                                   <CheckCircleIcon size={24} className="text-emerald-400" />
                                 </div>
                                 <p className="text-emerald-300 font-bold font-ui text-sm truncate max-w-[200px]">{gameFile.name}</p>
                                 <p className="text-emerald-500/70 text-xs mt-1">{(gameFile.size / 1024 / 1024).toFixed(2)} MB • Click to change</p>
                               </div>
                             ) : (
                               <div className="text-center pointer-events-none">
                                 <FileZipIcon size={40} className="mx-auto text-violet-500/50 mb-3 group-hover:text-violet-400 transition-colors group-hover:-translate-y-1 duration-300" />
                                 <p className="text-violet-300 font-bold font-ui text-sm">Upload Game File</p>
                                 <p className="text-slate-500 text-xs mt-1">HTML5 Index or WebGL Build</p>
                               </div>
                             )}
                             <input type="file" ref={gameInputRef} onChange={handleGameFileChange} accept=".zip,.html" className="hidden" />
                           </div>
                         </div>

                       </div>
                     </div>

                     <div className="mt-12 pt-8 border-t border-violet-500/10 flex flex-col sm:flex-row items-center justify-between gap-6">
                       <p className="text-slate-500 font-ui text-sm max-w-md text-center sm:text-left">
                         By submitting, you agree to the Nexis Games Developer Terms of Service and confirm you own the rights to this content.
                       </p>
                       <button 
                         type="submit" 
                         disabled={!title || !author || !iconFile || !gameFile || selectedTags.length === 0}
                         className="w-full sm:w-auto px-12 py-5 bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white font-black font-heading text-xl tracking-widest uppercase rounded-2xl transition-all disabled:opacity-50 disabled:grayscale hover:from-violet-500 hover:to-fuchsia-500 active:scale-95 shadow-[0_0_30px_rgba(139,92,246,0.4)] flex items-center justify-center gap-3"
                       >
                         <UploadCloudIcon size={24} /> Submit Game
                       </button>
                     </div>
                   </form>
                 )}
               </div>
            )}

            {/* --- VIEW: MY SUBMISSIONS --- */}
            {activeView === 'my-submissions' && (
               <div className="w-full max-w-5xl animate-slide-up">
                 <div className="mb-10 text-center">
                   <h2 className="text-4xl md:text-5xl font-black font-heading text-white mb-4 drop-shadow-[0_0_15px_rgba(139,92,246,0.3)]">My Submissions</h2>
                   <p className="text-lg text-violet-300/70 font-ui max-w-2xl mx-auto">Track the status of your uploaded games. If your game is rejected, the admin will leave a note below.</p>
                 </div>

                 {mySubmissions.length === 0 ? (
                    <div className="glass-panel rounded-[2.5rem] p-16 text-center shadow-2xl flex flex-col items-center">
                       <div className="w-20 h-20 bg-obsidian-900 rounded-full flex items-center justify-center mb-6 border border-white/5 shadow-inner">
                         <Gamepad2Icon size={40} className="text-violet-500/50" />
                       </div>
                       <h3 className="text-2xl font-bold font-heading text-white mb-2">No Games Submitted</h3>
                       <p className="text-violet-400 font-ui mb-8">You haven't published any games to the portal yet.</p>
                       <button onClick={() => setActiveView('submit')} className="px-8 py-3 bg-violet-600 hover:bg-violet-500 text-white font-bold font-ui uppercase tracking-widest rounded-xl transition-all shadow-md active:scale-95">Start a Project</button>
                    </div>
                 ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                       {mySubmissions.map(sub => {
                           let statusColor = "bg-amber-500/20 text-amber-400 border-amber-500/30";
                           let statusText = "Pending Review";
                           let icon = "🟡";
                           
                           if (sub.status === 'accepted') {
                               statusColor = "bg-emerald-500/20 text-emerald-400 border-emerald-500/30";
                               statusText = "Accepted & Live";
                               icon = "🟢";
                           } else if (sub.status === 'rejected') {
                               statusColor = "bg-rose-500/20 text-rose-400 border-rose-500/30";
                               statusText = "Action Required";
                               icon = "🔴";
                           }

                           return (
                               <div key={sub.id} className="glass-panel rounded-3xl p-6 shadow-xl relative overflow-hidden group">
                                   {/* Delete Button (Withdraw) */}
                                   <button onClick={() => handleDeleteSubmission(sub.id)} className="absolute top-4 right-4 p-2 bg-obsidian-900 border border-white/5 rounded-lg text-slate-500 hover:text-rose-400 hover:border-rose-500/30 transition-all opacity-0 group-hover:opacity-100 z-10" title="Delete Submission">
                                       <TrashIcon size={16} />
                                   </button>

                                   <div className="flex items-center gap-4 mb-4 pr-10">
                                       <div className="w-16 h-16 rounded-2xl bg-obsidian-900 flex items-center justify-center shadow-inner border border-white/5 overflow-hidden flex-shrink-0">
                                           <span className="font-bold text-violet-500 text-2xl font-heading">{sub.title.charAt(0).toUpperCase()}</span>
                                       </div>
                                       <div>
                                           <h3 className="text-xl font-bold font-heading text-white line-clamp-1">{sub.title}</h3>
                                           <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[10px] font-black uppercase tracking-widest border mt-1 ${statusColor}`}>
                                               {icon} {statusText}
                                           </span>
                                       </div>
                                   </div>

                                   <div className="flex flex-wrap gap-2 mb-4">
                                       {sub.tags && sub.tags.map(tag => <span key={tag} className="px-2 py-0.5 bg-obsidian-950 border border-white/5 text-[10px] font-bold font-ui text-slate-400 uppercase tracking-widest rounded">{tag}</span>)}
                                   </div>

                                   {sub.adminComment && (
                                       <div className="mt-4 p-4 bg-obsidian-950/80 rounded-xl border border-violet-500/20 shadow-[inset_0_2px_4px_rgba(0,0,0,0.3)]">
                                           <p className="text-xs font-bold text-violet-400 uppercase tracking-widest mb-1 flex items-center gap-1.5"><ShieldIcon size={12}/> MOFU Admin Feedback</p>
                                           <p className="text-sm text-violet-200 font-ui leading-relaxed">"{sub.adminComment}"</p>
                                       </div>
                                   )}
                               </div>
                           );
                       })}
                    </div>
                 )}
               </div>
            )}

            {/* --- VIEW: ADMIN REVIEW QUEUE --- */}
            {activeView === 'admin' && isModerator && (
               <div className="w-full max-w-5xl animate-slide-up">
                 <div className="mb-10 flex flex-col sm:flex-row justify-between items-center gap-4 border-b border-white/5 pb-6">
                   <div>
                     <h2 className="text-4xl font-black font-heading text-white mb-2 drop-shadow-[0_0_15px_rgba(244,63,94,0.3)] flex items-center gap-3"><ShieldIcon size={32} className="text-rose-500" /> Admin Review Queue</h2>
                     <p className="text-slate-400 font-ui text-lg">Manage, approve, or reject user game submissions.</p>
                   </div>
                   <div className="px-4 py-2 bg-obsidian-950 border border-white/10 rounded-xl shadow-inner text-center">
                       <span className="block text-2xl font-black text-white">{allSubmissions.length}</span>
                       <span className="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Total Active</span>
                   </div>
                 </div>

                 {allSubmissions.length === 0 ? (
                    <div className="glass-panel rounded-[2.5rem] p-16 text-center shadow-2xl flex flex-col items-center">
                       <CheckCircleIcon size={64} className="text-emerald-500/50 mb-6" />
                       <h3 className="text-2xl font-bold font-heading text-white mb-2">Queue is Empty</h3>
                       <p className="text-violet-400 font-ui">There are no pending game submissions to review.</p>
                    </div>
                 ) : (
                    <div className="space-y-6">
                       {allSubmissions.map(sub => (
                           <AdminSubmissionCard 
                               key={sub.id} 
                               sub={sub} 
                               onUpdate={handleAdminUpdate} 
                               onDelete={handleDeleteSubmission} 
                           />
                       ))}
                    </div>
                 )}
               </div>
            )}

            {/* AUTH MODAL UI */}
            {showAuthModal && (
              <div className="absolute inset-0 bg-black/80 backdrop-blur-md z-[200] flex items-center justify-center p-4">
                 <div className="bg-obsidian-900 border border-violet-500/20 rounded-[2.5rem] p-8 sm:p-10 w-full max-w-md shadow-[0_30px_60px_rgba(0,0,0,0.8)] relative animate-modal-pop">
                    <button 
                      onClick={() => { setShowAuthModal(false); setAuthMode('login'); setAuthError(''); setResetMessage(''); }} 
                      className="absolute top-6 right-6 p-2 bg-violet-500/10 rounded-xl text-violet-400/70 hover:text-violet-200 hover:bg-violet-500/20 transition-colors active:scale-95 shadow-inner"
                    >
                      <XIcon size={20} />
                    </button>
                    
                    <h2 className="text-3xl font-black font-heading text-violet-100 mb-8 tracking-wide drop-shadow-sm">
                      {authMode === 'login' ? 'Welcome Back' : authMode === 'signup' ? 'Create Account' : 'Reset Password'}
                    </h2>
                    
                    {authError && (
                      <div className="mb-6 p-4 bg-rose-500/10 border border-rose-500/30 text-rose-400 font-ui font-semibold text-sm rounded-xl flex items-center gap-3 shadow-sm">
                        <XIcon size={18} className="text-rose-500 flex-shrink-0" /> {authError}
                      </div>
                    )}
                    
                    {resetMessage && (
                      <div className="mb-6 p-4 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-ui font-semibold text-sm rounded-xl flex items-center gap-3 shadow-sm">
                        <CheckCircleIcon size={18} className="text-emerald-500 flex-shrink-0" /> 
                        {resetMessage}
                      </div>
                    )}
                    
                    <form onSubmit={authMode === 'login' ? handleLogin : authMode === 'signup' ? handleSignup : handlePasswordReset} className="space-y-5">
                      {authMode === 'signup' && (
                        <div>
                          <label className="block text-xs font-bold tracking-widest uppercase text-violet-400 mb-2 ml-1">Username</label>
                          <input 
                            type="text" 
                            required 
                            value={username} 
                            onChange={e => setUsername(e.target.value)} 
                            className="w-full bg-obsidian-950 border border-violet-500/20 rounded-xl px-4 py-3.5 font-ui text-base text-violet-100 focus:outline-none focus:ring-2 focus:ring-violet-500 transition-all shadow-[inset_0_2px_4px_rgba(0,0,0,0.2)]" 
                            placeholder="ProGamer123" 
                          />
                        </div>
                      )}
                      
                      <div>
                        <label className="block text-xs font-bold tracking-widest uppercase text-violet-400 mb-2 ml-1">Email Address</label>
                        <input 
                          type="email" 
                          required 
                          value={email} 
                          onChange={e => setEmail(e.target.value)} 
                          className="w-full bg-obsidian-950 border border-violet-500/20 rounded-xl px-4 py-3.5 font-ui text-base text-violet-100 focus:outline-none focus:ring-2 focus:ring-violet-500 transition-all shadow-[inset_0_2px_4px_rgba(0,0,0,0.2)]" 
                          placeholder="player@example.com" 
                        />
                      </div>
                      
                      {authMode !== 'reset' && (
                        <div>
                          <label className="block text-xs font-bold tracking-widest uppercase text-violet-400 mb-2 ml-1">Password</label>
                          <div className="relative">
                            <input 
                              type={showPassword ? "text" : "password"} 
                              required 
                              minLength={6} 
                              value={password} 
                              onChange={e => setPassword(e.target.value)} 
                              className="w-full bg-obsidian-950 border border-violet-500/20 rounded-xl px-4 py-3.5 pr-12 font-ui text-base text-violet-100 focus:outline-none focus:ring-2 focus:ring-violet-500 transition-all shadow-[inset_0_2px_4px_rgba(0,0,0,0.2)]" 
                              placeholder="••••••••" 
                            />
                            <button 
                              type="button" 
                              onClick={() => setShowPassword(!showPassword)} 
                              className="absolute inset-y-0 right-0 pr-4 flex items-center text-violet-500 hover:text-violet-300 transition-colors"
                            >
                              {showPassword ? <EyeOffIcon size={18} /> : <EyeIcon size={18} />}
                            </button>
                          </div>
                          {authMode === 'login' && (
                            <div className="mt-3 text-right">
                              <button 
                                type="button" 
                                onClick={() => { setAuthMode('reset'); setAuthError(''); setResetMessage(''); }} 
                                className="text-xs font-ui font-bold text-violet-400/70 hover:text-violet-300 transition-colors"
                              >
                                Forgot password?
                              </button>
                            </div>
                          )}
                        </div>
                      )}
                      
                      {/* ANTI-BOT VERIFICATION */}
                      {(authMode === 'signup' || authMode === 'login') && (
                        <div className="bg-obsidian-950/80 p-5 rounded-xl border border-violet-500/10 mt-2 shadow-[inset_0_2px_4px_rgba(0,0,0,0.3)] flex flex-col items-center w-full">
                          
                          <div id="turnstile-container" className="mb-2 w-full flex justify-center"></div>
                          
                          {/* Fallback Math Check (only runs if Turnstile failed to load) */}
                          {authMode === 'signup' && captchaBypass && (
                            <div className="flex items-center gap-4 w-full mt-2">
                              <span className="text-xl font-bold text-violet-200">{botCheck.num1} + {botCheck.num2} =</span>
                              <input 
                                type="number" 
                                required 
                                value={botCheck.answer} 
                                onChange={e => setBotCheck({...botCheck, answer: e.target.value})} 
                                className="flex-1 bg-obsidian-900 border border-violet-500/20 rounded-lg px-3 py-2 font-ui text-base text-violet-100 focus:outline-none focus:border-violet-500/50 transition-colors" 
                                placeholder="?" 
                              />
                            </div>
                          )}
                        </div>
                      )}

                      <button 
                        disabled={authLoading || authCooldown} 
                        type="submit" 
                        className="w-full py-4 bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 text-violet-100 font-bold font-ui text-sm tracking-widest uppercase rounded-xl transition-all mt-8 disabled:opacity-50 flex justify-center active:scale-95 shadow-[0_0_20px_rgba(139,92,246,0.4)] border border-violet-400/20"
                      >
                        {authLoading ? (
                          <div className="w-5 h-5 border-2 border-violet-100 border-t-transparent rounded-full animate-spin"></div>
                        ) : ( 
                          authMode === 'login' ? 'Sign In' : authMode === 'signup' ? 'Create Account' : 'Send Reset Link' 
                        )}
                      </button>
                    </form>
                    
                    <div className="mt-8 text-center border-t border-violet-500/10 pt-6">
                      {authMode === 'reset' ? (
                        <button 
                          onClick={() => { setAuthMode('login'); setAuthError(''); setResetMessage(''); }} 
                          className="text-violet-400 hover:text-violet-200 font-ui font-bold text-sm transition-colors"
                        >
                          Back to Sign In
                        </button>
                      ) : (
                        <button 
                          onClick={() => { setAuthMode(authMode === 'login' ? 'signup' : 'login'); setAuthError(''); }} 
                          className="text-violet-400 hover:text-violet-200 font-ui font-bold text-sm transition-colors"
                        >
                          {authMode === 'login' ? "Don't have an account? Sign up" : "Already have an account? Sign in"}
                        </button>
                      )}
                    </div>
                 </div>
              </div>
            )}
            
            {/* --- TOAST NOTIFICATIONS --- */}
            {toast && (
              <div className={`fixed bottom-6 right-6 px-6 py-4 rounded-2xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.5)] z-[300] font-ui font-bold text-xl flex items-center gap-3 animate-toast-slide border ${toast.type === 'error' ? 'bg-rose-600 text-white border-rose-500/50' : 'bg-obsidian-800 text-violet-300 border-violet-500/30'}`}>
                {toast.type === 'error' ? <XIcon size={24}/> : <CheckCircleIcon size={24}/>}
                {toast.message}
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root')); 
    root.render(<App />);
  </script>
</body>
</html>
